# Checked-in local profile for `make examples-local`.
#
# One DynamoDB Local service on a dedicated loopback port (8130 by default,
# never the shared :8000 and not TableTheory's :8123). The harness owns the
# host port: it leases a slot from the dedicated 8130-8199 range, exports
# APPTHEORY_LOCAL_DDB_PORT for this file, and derives a per-checkout compose
# project name, so two sessions or reviewers on one host never share or
# recreate each other's database.
#
# The in-memory database is deliberately ephemeral: every harness run starts
# from an empty backend, so examples cannot depend on state left behind by an
# earlier run or by another checkout.
services:
  dynamodb-local:
    image: amazon/dynamodb-local@sha256:7ef4a2c45b58c2901e70a4f28e0953a422c2c631baaaf5e2c15e0805740c7752
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "127.0.0.1:${APPTHEORY_LOCAL_DDB_PORT:-8130}:8000"
    restart: "no"
