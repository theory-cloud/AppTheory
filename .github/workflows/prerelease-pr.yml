name: Prerelease PR (premain)

# Generated release-candidate pull request producer.
#
# Every step below runs on the built-in token. There is no release-please
# credential: release-please opens and updates its pull request with
# `GITHUB_TOKEN`, and GitHub starts no `pull_request` workflow for events that
# token causes. The required contexts come from the code-owner review of the
# pull request: ci.yml runs on `pull_request_review: [submitted]` against the
# reviewed pull request and its own head, and that is an eligible event for a
# required status check. This lane therefore only has to hand the generated pull
# request to that review.
#
# `workflow_dispatch` re-runs this idempotent lane on demand.

on:
  push:
    branches: ["premain"]
    paths-ignore:
      - ".release-please-manifest.premain.json"
      - "CHANGELOG.md"
      - "VERSION"
      - "ts/package.json"
      - "ts/package-lock.json"
      - "cdk/package.json"
      - "cdk/package-lock.json"
      - "cdk/.jsii"
      - "py/pyproject.toml"
      - "examples/cdk/multilang/package-lock.json"
      - "examples/cdk/ssr-site/package-lock.json"
      - "examples/cdk/lesser-parity/package-lock.json"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-pr-${{ github.repository }}-release-please--branches--premain
  cancel-in-progress: false

jobs:
  release-please:
    # A manual dispatch from any other ref would execute that ref's scripts with
    # this workflow's write permissions. Only the release branch runs. A push
    # carrying a release-please merge is skipped: its content already came
    # through this lane.
    if: github.ref == 'refs/heads/premain' && !contains(github.event.head_commit.message, 'release-please--branches--premain')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify branch version sync before release PR
        run: scripts/verify-branch-version-sync.sh

      - name: Release Please (PR only)
        id: release
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Wrapper stages release-please@17.11.2 without credentials in npm and
          # invokes its parser in-process with an environment-only token. It
          # always applies --draft-pull-request internally.
          scripts/run-release-please-pr.sh \
            --target-branch premain \
            --config-file release-please-config.premain.json \
            --manifest-file .release-please-manifest.premain.json

      - name: Verify generated RC release PR postcondition
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/verify-release-pr-postcondition.sh prerelease

      - name: Detect open release PR
        id: release_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number="$(
            gh pr list \
              --state open \
              --base premain \
              --head release-please--branches--premain \
              --json number \
              --jq '.[0].number // ""'
          )"
          if [[ -n "${pr_number}" ]]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "number=${pr_number}" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Draft-lock release PR before artifact setup
        if: steps.release_pr.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ steps.release_pr.outputs.number }}
        run: |
          set -euo pipefail

          is_draft="$(gh pr view "${RELEASE_PR_NUMBER}" --json isDraft --jq '.isDraft')"
          if [[ "${is_draft}" != "true" ]]; then
            gh pr ready "${RELEASE_PR_NUMBER}" --undo
          fi

          is_draft="$(gh pr view "${RELEASE_PR_NUMBER}" --json isDraft --jq '.isDraft')"
          if [[ "${is_draft}" != "true" ]]; then
            echo "release-pr: FAIL (PR #${RELEASE_PR_NUMBER} could not be draft-locked before artifact setup)" >&2
            exit 1
          fi

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.release_pr.outputs.exists == 'true'
        with:
          go-version: "1.27.4"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.release_pr.outputs.exists == 'true'
        with:
          node-version: "24.13.1"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.release_pr.outputs.exists == 'true'
        with:
          python-version: "3.14"

      - name: Verify apptheory-init template/release pairing
        if: steps.release_pr.outputs.exists == 'true'
        run: |
          bash scripts/verify-release-pairing.sh --self-test
          bash scripts/verify-release-pairing.sh

      - name: Sync generated CDK artifacts on release PR
        if: steps.release_pr.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/sync-release-pr-generated.sh release-please--branches--premain

      # release-please opens the generated release pull request as a draft, and
      # the draft lock above keeps it out of the merge path while the artifact
      # sync commits land. The required contexts are reported by the code-owner
      # review of the pull request (ci.yml `pull_request_review`), so this job
      # only has to hand the finished pull request to that review: mark it ready
      # at the head the sync ended on, and fail closed if the head moves while
      # marking ready, restoring the draft lock so nothing stale can merge.
      - name: Mark the generated release PR ready for code-owner review
        if: steps.release_pr.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ steps.release_pr.outputs.number }}
        run: |
          set -euo pipefail

          head_before="$(gh pr view "${RELEASE_PR_NUMBER}" --json headRefOid --jq '.headRefOid')"
          gh pr ready "${RELEASE_PR_NUMBER}"

          projected="$(gh pr view "${RELEASE_PR_NUMBER}" --json isDraft,headRefOid)"
          is_draft="$(jq -r '.isDraft' <<<"${projected}")"
          head_after="$(jq -r '.headRefOid' <<<"${projected}")"

          if [[ "${is_draft}" != "false" ]]; then
            echo "release-pr: FAIL (PR #${RELEASE_PR_NUMBER} is still a draft after marking it ready)" >&2
            exit 1
          fi
          if [[ "${head_after}" != "${head_before}" ]]; then
            gh pr ready "${RELEASE_PR_NUMBER}" --undo
            echo "release-pr: FAIL (PR #${RELEASE_PR_NUMBER} head moved from ${head_before} to ${head_after} while marking ready; restored the draft lock)" >&2
            exit 1
          fi

          echo "release-pr: PASS (PR #${RELEASE_PR_NUMBER} ready at ${head_after} for the code-owner review)"

