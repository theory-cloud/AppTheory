name: CI

on:
  # Gate-class checks run on pull requests only. staging is where the gates are
  # verified; premain and main only receive PRs from staging or a generated
  # release-please branch, and a merge never re-runs a gate.
  pull_request:
    branches: [staging, premain, main]
    types: [opened, synchronize, reopened, ready_for_review]
  # A required status check is only evaluated when the run that reported it was
  # triggered by push, pull_request, pull_request_review, pull_request_target,
  # deployment or deployment_status. A generated release pull request is created
  # and updated with the built-in token, so its pull_request events never start a
  # run; the code-owner approval the premain/main ruleset already requires is the
  # one eligible event this repository can produce without a credential. The
  # code-owner review of a promotion pull request therefore runs the same release
  # checks against the same head.
  pull_request_review:
    types: [submitted]
    branches: [premain, main]
  workflow_dispatch:
    inputs:
      release_pr_number:
        description: "Generated release PR number for head-bound release checks"
        required: false
        type: string
        default: ""
      release_head_sha:
        description: "Generated release PR head SHA the dispatch was made against"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  release-train-promotion:
    name: Release train promotion gate
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || (github.event_name == 'workflow_dispatch' && inputs.release_pr_number != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted release gate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          # Run verifier code from the protected staging lane, never from PR-head content.
          ref: refs/heads/staging
      - name: Verify release train promotion path
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR_NUMBER: ${{ inputs.release_pr_number }}
          DISPATCH_HEAD_SHA: ${{ inputs.release_head_sha }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          DISPATCH_REF_SHA: ${{ github.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ ! "${DISPATCH_PR_NUMBER}" =~ ^[0-9]+$ ]]; then
              echo "release-train-promotion: FAIL (workflow_dispatch requires a numeric release_pr_number)" >&2
              exit 1
            fi
            if [[ ! "${DISPATCH_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "release-train-promotion: FAIL (workflow_dispatch requires the release PR head SHA the lane dispatched)" >&2
              exit 1
            fi

            # One resolver owns the dispatch binding: it refuses a closed pull
            # request, a foreign head repository, a non-release base and a moved
            # branch head, so a dispatched run can never certify a tree the pull
            # request does not contain.
            resolved="$(bash scripts/resolve-release-pr-head.sh \
              --repo "${GITHUB_REPOSITORY}" \
              --pr "${DISPATCH_PR_NUMBER}" \
              --ref-name "${DISPATCH_REF_NAME}" \
              --ref-sha "${DISPATCH_REF_SHA}")"
            resolved_head="$(sed -n 's/^head_sha=//p' <<<"${resolved}")"
            if [[ "${resolved_head}" != "${DISPATCH_HEAD_SHA}" ]]; then
              echo "::warning::the generated release PR head moved from ${DISPATCH_HEAD_SHA} to ${resolved_head}; verifying the current head"
            fi

            PR_BASE_REF="$(sed -n 's/^base_ref=//p' <<<"${resolved}")"
            PR_HEAD_REF="$(sed -n 's/^head_ref=//p' <<<"${resolved}")"
            PR_HEAD_REPOSITORY="$(sed -n 's/^head_repo=//p' <<<"${resolved}")"
            PR_HEAD_SHA="$(sed -n 's/^head_sha=//p' <<<"${resolved}")"
            PR_TITLE="$(sed -n 's/^pr_title=//p' <<<"${resolved}")"
          fi

          base_ref_args=()
          pr_title_args=()
          if scripts/verify-release-train-promotion.sh --help | grep -q -- "--pr-title"; then
            pr_title_args=(--pr-title "${PR_TITLE}")
          fi

          release_ref_depth_args=()
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            release_ref_depth_args=(--unshallow)
          fi
          git fetch --no-tags "${release_ref_depth_args[@]}" origin \
            "+refs/heads/staging:refs/remotes/origin/staging" \
            "+refs/heads/premain:refs/remotes/origin/premain" \
            "+refs/heads/main:refs/remotes/origin/main"

          case "${PR_BASE_REF}" in
            staging|premain|main)
              base_ref_args=(--base-ref "refs/remotes/origin/${PR_BASE_REF}")
              ;;
          esac

          scripts/verify-release-train-promotion.sh \
            --base "${PR_BASE_REF}" \
            --head "${PR_HEAD_REF}" \
            "${base_ref_args[@]}" \
            --head-sha "${PR_HEAD_SHA}" \
            --github-repository "${GITHUB_REPOSITORY}" \
            --github-head-repository "${PR_HEAD_REPOSITORY}" \
            "${pr_title_args[@]}"

  release-security-gates:
    name: Release/security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # On a dispatched run the checkout above is the ref the lane dispatched.
      # The resolver proves that ref really is the generated release pull
      # request head, so this job can never certify a tree the pull request
      # does not contain.
      - name: Bind the dispatched run to the generated release PR head
        if: github.event_name == 'workflow_dispatch'
        id: release_pr
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISPATCH_PR_NUMBER: ${{ inputs.release_pr_number }}
          DISPATCH_HEAD_SHA: ${{ inputs.release_head_sha }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          DISPATCH_REF_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${DISPATCH_PR_NUMBER}" =~ ^[0-9]+$ || ! "${DISPATCH_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release-security-gates: FAIL (a dispatched run requires the release PR number and head SHA it was dispatched for)" >&2
            exit 1
          fi
          resolved="$(bash scripts/resolve-release-pr-head.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --pr "${DISPATCH_PR_NUMBER}" \
            --ref-name "${DISPATCH_REF_NAME}" \
            --ref-sha "${DISPATCH_REF_SHA}")"
          printf '%s\n' "${resolved}" >>"${GITHUB_OUTPUT}"
          # The lane dispatches the head it read. If the branch moved between
          # that read and this dispatch, the run is at the pull request's new
          # head: verify it and say so instead of certifying a tree the pull
          # request no longer contains. The lane re-reads the head after this
          # wait and keeps it green from here.
          resolved_head="$(sed -n 's/^head_sha=//p' <<<"${resolved}")"
          if [[ "${resolved_head}" != "${DISPATCH_HEAD_SHA}" ]]; then
            echo "::warning::the generated release PR head moved from ${DISPATCH_HEAD_SHA} to ${resolved_head}; verifying the current head"
          fi
      - name: Verify the checked-out tree is the resolved release PR head
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [[ "${checked_out}" != "${{ steps.release_pr.outputs.head_sha }}" ]]; then
            echo "release-security-gates: FAIL (checked out ${checked_out}, resolved release PR head ${{ steps.release_pr.outputs.head_sha }})" >&2
            exit 1
          fi
      # The release/security gates run scripts/verify-ci-rubric-enforced.sh,
      # which classifies the workflow through cmd/ci-guard, so the pinned Go
      # toolchain is provisioned before them.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
      # These invariants always execute on the new commit. They are deliberately
      # not evidence-aware: their whole value is re-reading the current merge,
      # signature and workflow wiring.
      - name: Verify release/security invariants
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/verify-branch-release-supply-chain.sh
          bash scripts/verify-release-branch-signatures.sh
          bash scripts/verify-release-train-promotion.sh --self-test
          bash scripts/verify-ci-rubric-enforced.sh
          bash scripts/verify-release-workflows.sh
          bash scripts/verify-release-cycle.sh
      - name: Verify runtime floor claims
        run: bash scripts/verify-runtime-floor-claims.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Verify apptheory-init template/release pairing
        run: |
          bash scripts/verify-release-pairing.sh --self-test
          bash scripts/verify-release-pairing.sh

  security-refresh:
    name: Security refresh (dependency scan)
    if: github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'premain' || github.event.pull_request.base.ref == 'main') && github.event.pull_request.head.ref == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the recorded dependency scan and its freshness
        run: bash scripts/evidence/verify-gate.sh --gate security-refresh --profile default

  release-delta:
    name: Release delta validation
    if: (github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'premain' || github.event.pull_request.base.ref == 'main') && (github.event.pull_request.head.ref == 'release-please--branches--premain' || github.event.pull_request.head.ref == 'release-please--branches--main')) || (github.event_name == 'workflow_dispatch' && inputs.release_pr_number != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind the dispatched run to the generated release PR head
        if: github.event_name == 'workflow_dispatch'
        id: release_pr
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISPATCH_PR_NUMBER: ${{ inputs.release_pr_number }}
          DISPATCH_HEAD_SHA: ${{ inputs.release_head_sha }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          DISPATCH_REF_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${DISPATCH_PR_NUMBER}" =~ ^[0-9]+$ || ! "${DISPATCH_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release-delta: FAIL (a dispatched run requires the release PR number and head SHA it was dispatched for)" >&2
            exit 1
          fi
          resolved="$(bash scripts/resolve-release-pr-head.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --pr "${DISPATCH_PR_NUMBER}" \
            --ref-name "${DISPATCH_REF_NAME}" \
            --ref-sha "${DISPATCH_REF_SHA}")"
          printf '%s\n' "${resolved}" >>"${GITHUB_OUTPUT}"
          # The lane dispatches the head it read. If the branch moved between
          # that read and this dispatch, the run is at the pull request's new
          # head: verify it and say so instead of certifying a tree the pull
          # request no longer contains. The lane re-reads the head after this
          # wait and keeps it green from here.
          resolved_head="$(sed -n 's/^head_sha=//p' <<<"${resolved}")"
          if [[ "${resolved_head}" != "${DISPATCH_HEAD_SHA}" ]]; then
            echo "::warning::the generated release PR head moved from ${DISPATCH_HEAD_SHA} to ${resolved_head}; verifying the current head"
          fi
      - name: Verify the dispatched release branch identity
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [[ "${checked_out}" != "${{ steps.release_pr.outputs.head_sha }}" ]]; then
            echo "release-delta: FAIL (checked out ${checked_out}, resolved release PR head ${{ steps.release_pr.outputs.head_sha }})" >&2
            exit 1
          fi
          case "${{ steps.release_pr.outputs.head_ref }}" in
            release-please--branches--premain|release-please--branches--main) ;;
            *)
              echo "release-delta: FAIL (release PR head ${{ steps.release_pr.outputs.head_ref }} is not a generated release branch)" >&2
              exit 1
              ;;
          esac
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: |
            go.sum
            cdk-go/apptheorycdk/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            ts/package-lock.json
            cdk/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            py/pyproject.toml
            py/requirements-build.txt
      # Generated release PRs never repeat the source rubric, contract corpus,
      # examples harness or language test suites. Version coupling, regeneration
      # equality and package smoke run once for the changed artifact set. This is
      # an artifact-production smoke over generated content that does not exist
      # locally before release-please generates it, so it is the one job that
      # executes; it is never reusable evidence and never verifies a record.
      - name: Verify generated release delta
        run: python3 scripts/evidence/validation_evidence.py run --gate release-delta --forced

  runtime-floor-matrix:
    name: Runtime floor matrix (Node ${{ matrix.node-version }}, Python ${{ matrix.python-version }})
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each cell is a distinct tested environment with its own tracked proof
        # profile, produced locally under that floor. The latest/latest leg is the
        # dedicated Go/TypeScript/Python/contract job set. These cells verify
        # their records; a changed floor or input invalidates only that profile.
        include:
          - node-version: "22"
            python-version: "3.12"
            ts-profile: floor-node22
            py-profile: floor-py3.12
            contract-profile: floor-node22-py3.12
          - node-version: "22"
            python-version: "3.14"
            ts-profile: floor-node22
            py-profile: default
            contract-profile: floor-node22-py3.14
          - node-version: "24"
            python-version: "3.12"
            ts-profile: default
            py-profile: floor-py3.12
            contract-profile: floor-node24-py3.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify lower-floor package and fixture proof
        run: |
          bash scripts/evidence/verify-gate.sh --gate ts --profile "${{ matrix.ts-profile }}"
          bash scripts/evidence/verify-gate.sh --gate py --profile "${{ matrix.py-profile }}"
          bash scripts/evidence/verify-gate.sh --gate contract-tests --profile "${{ matrix.contract-profile }}"

  cdk-floor-matrix:
    name: CDK floor matrix (Node ${{ matrix.node-version }})
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 24 is covered by the dedicated CDK Go binding drift job, which
        # uses the default profile.
        include:
          - node-version: "22"
            drift-profile: floor-node22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: cdk/package-lock.json
      # Same profile mechanism as the runtime floor: this job verifies the
      # committed Node 22 binding record instead of regenerating it.
      - name: Verify CDK lower-floor generated binding proof
        run: bash scripts/evidence/verify-gate.sh --gate cdk-go-drift --profile "${{ matrix.drift-profile }}"
      - name: Verify CDK dependency engines admit the Node floor
        run: bash scripts/verify-cdk-engines-floor.sh

  prerelease-readiness:
    name: Prerelease readiness (staging → premain)
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'premain' && github.event.pull_request.head.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify user-facing conventional commits exist
        run: |
          set -euo pipefail

          git fetch origin premain staging --force
          bash scripts/verify-release-eligibility.sh \
            --range "origin/premain..origin/staging" \
            --context "prerelease readiness (staging → premain)"

  staging-release-eligibility:
    name: Release eligibility (staging → premain)
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'premain' && github.event.pull_request.head.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify the promotion range stays release-eligible
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The gate runs on the staging → premain promotion pull request, where
          # HEAD is the merge commit into premain, so origin/premain..HEAD is
          # exactly the range the promotion ships. A push to staging no longer
          # re-runs it: the promotion pull request is the pre-merge surface that
          # can actually ship the range. It deliberately does not run on pull
          # requests into staging: those
          # asked for a verdict on staging's whole post-release range, which
          # carries no release-driving commit until the next feat:/fix:/perf:
          # lands, so every docs-, chore-, test- and CI-only pull request failed a
          # gate it could not fix (operator decision 2026-10-12). origin/main is
          # fetched for the post-release main back-merge exemption only: after a
          # stable release the returned main branch carries nothing release-please
          # can ship, so that one merge must not read as a missing release driver.
          git fetch origin premain staging main --force
          bash scripts/verify-release-eligibility.sh \
            --range "origin/premain..HEAD" \
            --context "staging release eligibility" \
            --allow-main-backmerge \
            --head-ref "${PR_HEAD_REF}" \
            --head-repo "${PR_HEAD_REPOSITORY}" \
            --repository "${GITHUB_REPOSITORY}"

  version-alignment:
    name: Version alignment
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || (github.event.pull_request.head.ref != 'release-please--branches--premain' && github.event.pull_request.head.ref != 'release-please--branches--main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bind the dispatched run to the generated release PR head
        if: github.event_name == 'workflow_dispatch'
        id: release_pr
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISPATCH_PR_NUMBER: ${{ inputs.release_pr_number }}
          DISPATCH_HEAD_SHA: ${{ inputs.release_head_sha }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          DISPATCH_REF_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${DISPATCH_PR_NUMBER}" =~ ^[0-9]+$ || ! "${DISPATCH_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "version-alignment: FAIL (a dispatched run requires the release PR number and head SHA it was dispatched for)" >&2
            exit 1
          fi
          resolved="$(bash scripts/resolve-release-pr-head.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --pr "${DISPATCH_PR_NUMBER}" \
            --ref-name "${DISPATCH_REF_NAME}" \
            --ref-sha "${DISPATCH_REF_SHA}")"
          printf '%s\n' "${resolved}" >>"${GITHUB_OUTPUT}"
          # The lane dispatches the head it read. If the branch moved between
          # that read and this dispatch, the run is at the pull request's new
          # head: verify it and say so instead of certifying a tree the pull
          # request no longer contains. The lane re-reads the head after this
          # wait and keeps it green from here.
          resolved_head="$(sed -n 's/^head_sha=//p' <<<"${resolved}")"
          if [[ "${resolved_head}" != "${DISPATCH_HEAD_SHA}" ]]; then
            echo "::warning::the generated release PR head moved from ${DISPATCH_HEAD_SHA} to ${resolved_head}; verifying the current head"
          fi
      - name: Verify the checked-out tree is the resolved release PR head
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [[ "${checked_out}" != "${{ steps.release_pr.outputs.head_sha }}" ]]; then
            echo "version-alignment: FAIL (checked out ${checked_out}, resolved release PR head ${{ steps.release_pr.outputs.head_sha }})" >&2
            exit 1
          fi
      - name: Verify versions match VERSION
        run: scripts/verify-version-alignment.sh
      - name: Verify branch release version state
        run: scripts/verify-branch-version-sync.sh

  go:
    name: Go (test + vet)
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the recorded Go test and vet run
        run: bash scripts/evidence/verify-gate.sh --gate go --profile default

  ts:
    name: TypeScript (npm pack)
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the recorded dist-drift and package run
        run: bash scripts/evidence/verify-gate.sh --gate ts --profile default

  py:
    name: Python (build wheel + sdist)
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the recorded package build
        run: bash scripts/evidence/verify-gate.sh --gate py --profile default

  builds:
    name: Verify deterministic builds
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the recorded double-build comparison
        run: bash scripts/evidence/verify-gate.sh --gate deterministic-builds --profile default

  cdk-go-drift:
    name: CDK Go binding drift
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the recorded cdk-go binding regeneration
        run: bash scripts/evidence/verify-gate.sh --gate cdk-go-drift --profile default

  contract-tests:
    name: Contract tests (fixtures)
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the recorded API snapshot and contract run
        run: bash scripts/evidence/verify-gate.sh --gate contract-tests --profile default

  rubric:
    name: Rubric (full gate set)
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the recorded full rubric
        run: bash scripts/evidence/verify-gate.sh --gate rubric --profile default
