name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - staging
      - main
      - premain
  workflow_dispatch:
    inputs:
      run_full_rubric:
        description: "Run Rubric (full gate set)"
        required: false
        type: boolean
        default: true
      release_pr_number:
        description: "Generated release PR number for head-bound release checks"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  release-train-promotion:
    name: Release train promotion gate
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.release_pr_number != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted release gate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          # Run verifier code from the protected staging lane, never from PR-head content.
          ref: refs/heads/staging
      - name: Verify release train promotion path
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR_NUMBER: ${{ inputs.release_pr_number }}
          DISPATCH_HEAD_REF: ${{ github.ref_name }}
          DISPATCH_HEAD_SHA: ${{ github.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ ! "${DISPATCH_PR_NUMBER}" =~ ^[0-9]+$ ]]; then
              echo "release-train-promotion: FAIL (workflow_dispatch requires a numeric release_pr_number)" >&2
              exit 1
            fi

            pr_line="$(
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${DISPATCH_PR_NUMBER}" \
                --jq '[.state, .base.ref, .head.ref, .head.repo.full_name, .head.sha, .title] | @tsv'
            )"
            IFS=$'\t' read -r pr_state PR_BASE_REF PR_HEAD_REF PR_HEAD_REPOSITORY PR_HEAD_SHA PR_TITLE <<<"${pr_line}"

            if [[ "${pr_state}" != "open" ]]; then
              echo "release-train-promotion: FAIL (release PR #${DISPATCH_PR_NUMBER} is ${pr_state:-unknown})" >&2
              exit 1
            fi
            if [[ "${PR_HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]]; then
              echo "release-train-promotion: FAIL (release PR head repository ${PR_HEAD_REPOSITORY} != ${GITHUB_REPOSITORY})" >&2
              exit 1
            fi
            if [[ "${PR_HEAD_REF}" != "${DISPATCH_HEAD_REF}" || "${PR_HEAD_SHA}" != "${DISPATCH_HEAD_SHA}" ]]; then
              echo "release-train-promotion: FAIL (dispatched ref ${DISPATCH_HEAD_REF}@${DISPATCH_HEAD_SHA} != PR head ${PR_HEAD_REF}@${PR_HEAD_SHA})" >&2
              exit 1
            fi
          fi

          base_ref_args=()
          pr_title_args=()
          if scripts/verify-release-train-promotion.sh --help | grep -q -- "--pr-title"; then
            pr_title_args=(--pr-title "${PR_TITLE}")
          fi

          release_ref_depth_args=()
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            release_ref_depth_args=(--unshallow)
          fi
          git fetch --no-tags "${release_ref_depth_args[@]}" origin \
            "+refs/heads/staging:refs/remotes/origin/staging" \
            "+refs/heads/premain:refs/remotes/origin/premain" \
            "+refs/heads/main:refs/remotes/origin/main"

          case "${PR_BASE_REF}" in
            staging|premain|main)
              base_ref_args=(--base-ref "refs/remotes/origin/${PR_BASE_REF}")
              ;;
          esac

          scripts/verify-release-train-promotion.sh \
            --base "${PR_BASE_REF}" \
            --head "${PR_HEAD_REF}" \
            "${base_ref_args[@]}" \
            --head-sha "${PR_HEAD_SHA}" \
            --github-repository "${GITHUB_REPOSITORY}" \
            --github-head-repository "${PR_HEAD_REPOSITORY}" \
            "${pr_title_args[@]}"

  release-security-gates:
    name: Release/security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The release/security gates run scripts/verify-ci-rubric-enforced.sh,
      # which classifies the workflow through cmd/ci-guard, so the pinned Go
      # toolchain is provisioned before them.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
      # These invariants always execute on the new commit. They are deliberately
      # not evidence-aware: their whole value is re-reading the current merge,
      # signature and workflow wiring.
      - name: Verify release/security invariants
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/verify-branch-release-supply-chain.sh
          bash scripts/verify-release-branch-signatures.sh
          bash scripts/verify-release-train-promotion.sh --self-test
          bash scripts/verify-ci-rubric-enforced.sh
          bash scripts/verify-release-workflows.sh
          bash scripts/verify-release-cycle.sh
      - name: Verify runtime floor claims
        run: bash scripts/verify-runtime-floor-claims.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Verify apptheory-init template/release pairing
        run: |
          bash scripts/verify-release-pairing.sh --self-test
          bash scripts/verify-release-pairing.sh

  security-refresh:
    name: Security refresh (dependency scan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: |
            go.sum
            cdk-go/apptheorycdk/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            ts/package-lock.json
            cdk/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            py/requirements-build.txt
            py/requirements-lint.txt
            cdk/requirements-build.txt
      # A fresh dependency-scoped scan is reusable across train legs for 24h
      # (tracked in scripts/evidence/validation-gates.json). A stale scan, a
      # changed dependency input or untrusted PR origin executes the scan.
      - name: Verify dependency freshness or scan
        run: bash scripts/evidence/verify-or-execute.sh --gate security-refresh --profile default

  release-delta:
    name: Release delta validation
    if: (github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'premain' || github.event.pull_request.base.ref == 'main') && (github.event.pull_request.head.ref == 'release-please--branches--premain' || github.event.pull_request.head.ref == 'release-please--branches--main')) || (github.event_name == 'workflow_dispatch' && inputs.release_pr_number != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify dispatched release branch identity
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          DISPATCH_PR_NUMBER: ${{ inputs.release_pr_number }}
        run: |
          set -euo pipefail
          case "${DISPATCH_REF_NAME}" in
            release-please--branches--premain|release-please--branches--main) ;;
            *)
              echo "release-delta: FAIL (dispatch ref ${DISPATCH_REF_NAME} is not a generated release branch)" >&2
              exit 1
              ;;
          esac
          if [[ ! "${DISPATCH_PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "release-delta: FAIL (release_pr_number must be numeric)" >&2
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: |
            go.sum
            cdk-go/apptheorycdk/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            ts/package-lock.json
            cdk/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            py/pyproject.toml
            py/requirements-build.txt
      # Generated release PRs never repeat the source rubric, contract corpus,
      # examples harness or language test suites. Version coupling, regeneration
      # equality and package smoke run once for the changed artifact set.
      - name: Verify generated release delta
        env:
          EVIDENCE_FORCE_EXECUTE: "true"
        run: bash scripts/evidence/verify-or-execute.sh --gate release-delta

  runtime-floor-matrix:
    name: Runtime floor matrix (Node ${{ matrix.node-version }}, Python ${{ matrix.python-version }})
    if: (github.event_name != 'push' || !contains(github.event.head_commit.message, 'release-please--branches--')) && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.ref != 'release-please--branches--premain' && github.event.pull_request.head.ref != 'release-please--branches--main')) && !(github.event_name == 'workflow_dispatch' && inputs.release_pr_number != '')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each cell is a distinct tested environment with its own tracked proof
        # profile. The latest/latest leg is the dedicated Go/TypeScript/Python/
        # contract job set on the same toolchains. A profile's proof is reused
        # on every later release event for the same inputs; a changed floor or
        # input invalidates only that profile, never the whole matrix.
        include:
          - node-version: "22"
            python-version: "3.12"
            ts-profile: floor-node22
            py-profile: floor-py3.12
            contract-profile: floor-node22-py3.12
          - node-version: "22"
            python-version: "3.14"
            ts-profile: floor-node22
            py-profile: default
            contract-profile: floor-node22-py3.14
          - node-version: "24"
            python-version: "3.12"
            ts-profile: default
            py-profile: floor-py3.12
            contract-profile: floor-node24-py3.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: ts/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            py/pyproject.toml
            py/requirements-build.txt
      # The floor environment is a tracked proof profile, not a forced rerun on
      # every event. A committed record for this profile and these exact inputs
      # verifies; otherwise the real command executes once and the produced
      # sanitized record is preserved so a single commit makes every later leg
      # reuse it.
      - name: Verify lower-floor package and fixture proof
        run: |
          bash scripts/evidence/verify-or-execute.sh --gate ts --profile "${{ matrix.ts-profile }}"
          bash scripts/evidence/verify-or-execute.sh --gate py --profile "${{ matrix.py-profile }}"
          bash scripts/evidence/verify-or-execute.sh --gate contract-tests --profile "${{ matrix.contract-profile }}"
      - name: Preserve produced floor records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: floor-records-node${{ matrix.node-version }}-py${{ matrix.python-version }}
          path: gov-infra/evidence/proportionate/*/*.json
          if-no-files-found: ignore
          retention-days: 14

  cdk-floor-matrix:
    name: CDK floor matrix (Node ${{ matrix.node-version }})
    if: (github.event_name != 'push' || !contains(github.event.head_commit.message, 'release-please--branches--')) && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.ref != 'release-please--branches--premain' && github.event.pull_request.head.ref != 'release-please--branches--main')) && !(github.event_name == 'workflow_dispatch' && inputs.release_pr_number != '')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 24 is covered by the dedicated CDK Go binding drift job, which
        # uses the default profile.
        include:
          - node-version: "22"
            drift-profile: floor-node22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: cdk/package-lock.json
      # Same profile mechanism as the runtime floor: the Node 22 binding proof
      # is produced once and reused by every later leg for these inputs.
      - name: Verify CDK lower-floor generated binding proof
        run: bash scripts/evidence/verify-or-execute.sh --gate cdk-go-drift --profile "${{ matrix.drift-profile }}"
      - name: Verify CDK dependency engines admit the Node floor
        run: bash scripts/verify-cdk-engines-floor.sh
      - name: Preserve produced floor records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cdk-floor-records-node${{ matrix.node-version }}
          path: gov-infra/evidence/proportionate/*/*.json
          if-no-files-found: ignore
          retention-days: 14

  prerelease-readiness:
    name: Prerelease readiness (staging → premain)
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'premain' && github.event.pull_request.head.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify user-facing conventional commits exist
        run: |
          set -euo pipefail

          git fetch origin premain staging --force
          bash scripts/verify-release-eligibility.sh \
            --range "origin/premain..origin/staging" \
            --context "prerelease readiness (staging → premain)"

  staging-release-eligibility:
    name: Release eligibility (staging → premain)
    if: (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'premain' && github.event.pull_request.head.ref == 'staging') || (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify the promotion range stays release-eligible
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The gate runs on the staging → premain promotion pull request, where
          # HEAD is the merge commit into premain, so origin/premain..HEAD is
          # exactly the range the promotion ships. It also runs on the pushed
          # staging SHA, which is that same range re-checked before the promotion.
          # It deliberately does not run on pull requests into staging: those
          # asked for a verdict on staging's whole post-release range, which
          # carries no release-driving commit until the next feat:/fix:/perf:
          # lands, so every docs-, chore-, test- and CI-only pull request failed a
          # gate it could not fix (operator decision 2026-10-12). origin/main is
          # fetched for the post-release main back-merge exemption only: after a
          # stable release the returned main branch carries nothing release-please
          # can ship, so that one merge must not read as a missing release driver.
          git fetch origin premain staging main --force
          bash scripts/verify-release-eligibility.sh \
            --range "origin/premain..HEAD" \
            --context "staging release eligibility" \
            --allow-main-backmerge \
            --head-ref "${PR_HEAD_REF}" \
            --head-repo "${PR_HEAD_REPOSITORY}" \
            --repository "${GITHUB_REPOSITORY}"

  version-alignment:
    name: Version alignment
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || (github.event.pull_request.head.ref != 'release-please--branches--premain' && github.event.pull_request.head.ref != 'release-please--branches--main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify versions match VERSION
        run: scripts/verify-version-alignment.sh
      - name: Verify branch release version state
        run: scripts/verify-branch-version-sync.sh

  go:
    name: Go (test + vet)
    if: (github.event_name != 'push' || !contains(github.event.head_commit.message, 'release-please--branches--')) && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.ref != 'release-please--branches--premain' && github.event.pull_request.head.ref != 'release-please--branches--main')) && !(github.event_name == 'workflow_dispatch' && inputs.release_pr_number != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: go.sum
      # The CloudFront Functions conformance tests execute the generated code
      # in a Node vm; the repository requires Node >= 24 for that surface.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Verify Go tests and vet
        run: bash scripts/evidence/verify-or-execute.sh --gate go --profile default

  ts:
    name: TypeScript (npm pack)
    if: (github.event_name != 'push' || !contains(github.event.head_commit.message, 'release-please--branches--')) && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.ref != 'release-please--branches--premain' && github.event.pull_request.head.ref != 'release-please--branches--main')) && !(github.event_name == 'workflow_dispatch' && inputs.release_pr_number != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ts/package-lock.json
      - name: Verify checked-in dist drift and pack the tarball
        run: bash scripts/evidence/verify-or-execute.sh --gate ts --profile default

  py:
    name: Python (build wheel + sdist)
    if: (github.event_name != 'push' || !contains(github.event.head_commit.message, 'release-please--branches--')) && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.ref != 'release-please--branches--premain' && github.event.pull_request.head.ref != 'release-please--branches--main')) && !(github.event_name == 'workflow_dispatch' && inputs.release_pr_number != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            py/pyproject.toml
            py/requirements-build.txt
      - name: Build wheel + sdist
        run: bash scripts/evidence/verify-or-execute.sh --gate py --profile default

  builds:
    name: Verify deterministic builds
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: go.sum
      - name: Install golangci-lint (pinned)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            ts/package-lock.json
            cdk/package-lock.json
            examples/cdk/*/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            py/pyproject.toml
            py/requirements-build.txt
            py/requirements-lint.txt
            cdk/requirements-build.txt
      - name: Build twice and compare checksums
        run: bash scripts/evidence/verify-or-execute.sh --gate deterministic-builds --profile default

  cdk-go-drift:
    name: CDK Go binding drift
    if: (github.event_name != 'push' || !contains(github.event.head_commit.message, 'release-please--branches--')) && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.ref != 'release-please--branches--premain' && github.event.pull_request.head.ref != 'release-please--branches--main')) && !(github.event_name == 'workflow_dispatch' && inputs.release_pr_number != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: cdk/package-lock.json
      - name: Verify cdk-go generated binding drift
        run: bash scripts/evidence/verify-or-execute.sh --gate cdk-go-drift --profile default

  contract-tests:
    name: Contract tests (fixtures)
    if: (github.event_name != 'push' || !contains(github.event.head_commit.message, 'release-please--branches--')) && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.ref != 'release-please--branches--premain' && github.event.pull_request.head.ref != 'release-please--branches--main')) && !(github.event_name == 'workflow_dispatch' && inputs.release_pr_number != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ts/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: py/pyproject.toml
      - name: Verify API snapshots and contract fixtures
        run: bash scripts/evidence/verify-or-execute.sh --gate contract-tests --profile default

  rubric:
    name: Rubric (full gate set)
    if: (github.event_name == 'workflow_dispatch' && (inputs.run_full_rubric == true || inputs.run_full_rubric == 'true')) || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'staging')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: go.sum
      - name: Install golangci-lint (pinned)
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            ts/package-lock.json
            cdk/package-lock.json
            examples/cdk/*/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            py/pyproject.toml
            py/requirements-build.txt
            py/requirements-lint.txt
            cdk/requirements-build.txt
      # The required context keeps its name. A green run means the recorded
      # proof was verified for these exact inputs, or the rubric executed when
      # no applicable proof existed; the step prints which.
      - name: Verify reusable evidence or run full rubric
        run: bash scripts/evidence/verify-or-execute.sh --gate rubric --profile default
      - name: Upload GovTheory rubric evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gov-rubric-evidence
          path: gov-infra/evidence/
          if-no-files-found: error
          retention-days: 14
