name: Examples (Local)

# Verifies the committed local-harness evidence record on pull requests that
# target `staging`. The harness itself never runs here: a steward runs
# `make examples-local` locally, where the runner supplies its own DynamoDB Local
# endpoint and static dummy credentials, and commits the record it writes. The
# job carries no AWS secrets and needs no service container, because nothing
# executes.
# It runs only for PRs targeting `staging`: `premain` and `main` derive from
# `staging`, so the verified tree is the reviewed tree and a second harness run
# there would only repeat it.
on:
  pull_request:
    branches: ["staging"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  examples-local:
    name: Examples (local harness)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The local journey is the most expensive proof this repository records,
      # so it is produced once by the steward and verified here for the exact
      # inputs of this pull request. A missing or stale record fails the job and
      # names the collection command; no fallback executes the harness.
      - name: Verify the local harness evidence record
        run: bash scripts/evidence/verify-gate.sh --gate examples-local --profile default
