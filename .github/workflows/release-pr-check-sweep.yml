name: Release PR check lane (recovery sweep)

# Recovery sweep for the generated release pull requests.
#
# release-please and the generated-artifact sync open and update their pull
# requests with the built-in token, and GitHub starts no `pull_request` workflow
# for events that token causes. The producer lane therefore dispatches the
# verifying CI run itself and holds the pull request to its exact head. This
# sweep is the part of the lane that needs no event at all: every run reads the
# open generated release pull request, reuses green required contexts, refuses to
# re-dispatch around a red one, dispatches a head-bound verification when the
# contexts are missing, and marks the pull request ready only after the head is
# green. A pull request left checkless by an earlier event is re-verified against
# its current head within one sweep interval without any human action.
#
# It never executes a gate itself: it dispatches the same verifying workflow the
# producer lane dispatches, and it uses only the built-in token. It is not a
# gate: a red or stuck head is reported as a warning and the pull request shows
# the same state, so a scheduled run never fails the repository for a state it
# cannot fix by re-running.

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: write

concurrency:
  group: release-pr-check-sweep-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sweep:
    name: Re-verify generated release PR checks (${{ matrix.head_branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        head_branch:
          - release-please--branches--premain
          - release-please--branches--main
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Re-verify the generated release PR check lane
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/sync-release-pr-checks.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --head-branch "${{ matrix.head_branch }}" \
            --sweep
