# =============================================================
# AppTheory · GitHub Pages — Theory Cloud Docs
#
# Builds the Jekyll site under docs/ and deploys it to GitHub Pages.
#
# TRIGGER POLICY (aligned with the repo's publishing-workflow pattern):
#   - release.yml / release-pr.yml ........................ triggers on `main`
#   - prerelease.yml / prerelease-pr.yml .................. triggers on `premain`
#   - theorycloud-apptheory-subtree-publish.yml ........... triggers on `premain` AND `main`
#   - pages.yml (this file) ............................... `release` published + manual `workflow_dispatch`
#
# Pages deploy is release-EVENT driven, not branch-push driven. A branch-push
# trigger races release-please and builds the site from a mutable branch head,
# so the version pill and the runtime install pins in the rendered site always
# lag one release behind (e.g. the site showed v1.14.0 installs while the
# latest release was v3.3.0). Instead, this workflow checks out the published
# release tag and stamps the site from it:
#
#   1. Resolve the release tag — from the `release` event payload, or (on
#      workflow_dispatch) the latest published non-prerelease release via
#      `gh release view`. The build NEVER runs from a branch head.
#   2. Generate docs/_config_versions.yml from the resolved tag via
#      scripts/generate-docs-version-override.rb: the version pill and the
#      FULL tabletheory.runtimes array — Jekyll deep-merges config hashes but
#      REPLACES arrays wholesale, so the override must carry every runtime
#      entry — with every version inside each install command replaced by the
#      tag (`v${TAG}` where a tag is referenced, and `${TAG#v}` in asset
#      filenames). Checked-in docs/_config.yml stays untouched and remains the
#      local-preview fallback; the generated override wins in CI.
#   3. The landing page (docs/index.html) renders each runtime's install
#      command from site.tabletheory.runtimes (by-id lookup), falling back to
#      docs/_data/runtimes.yml, so the override's stamped installs are
#      load-bearing instead of dead weight.
#   4. Build with `jekyll build --config _config.yml,_config_versions.yml`.
#
# The github-pages environment's deployment policy accepts `v*` tag refs and
# the `staging` branch only, so no repo settings work is needed. A manual
# `workflow_dispatch` must be run from a ref that policy allows — the
# `staging` branch or a `v*` tag — or the deploy job is rejected by the
# environment policy. A docs-only fix that does not ship a release waits for
# the next release; deploy it early with workflow_dispatch from `staging`.
#
# Security invariants: the workflow token stays read-only except the
# pages write + id-token granted to the deploy job; the override is generated
# only from the release event payload or the resolved release tag; no secrets
# are introduced.
# =============================================================
name: pages

on:
  # Primary path: publish the docs site when a release is published.
  # Non-prerelease only — enforced by the job-level `if:` guards below.
  release:
    types: [published]
  # Manual re-deploy (e.g. after rotating the Pages environment, or to
  # republish after a docs-only fix). Resolves the latest published
  # non-prerelease release tag — never a branch head.
  workflow_dispatch:

# Default workflow token stays read-only. Pages/id-token privileges are
# granted only to the deploy job after the docs build artifact exists.
permissions:
  contents: read

# Coalesce in-flight deploys: if a second release publish (or manual
# re-deploy) lands before the previous deploy finishes, queue it (don't
# cancel) so we never skip a release's publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Jekyll site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUNDLE_DEPLOYMENT: "true"
      BUNDLE_FROZEN: "true"
      BUNDLE_PATH: vendor/bundle
    # Deploy only for published non-prerelease releases or manual re-deploys.
    # Prerelease publishes and any other event (e.g. branch pushes) must
    # never build or publish the site.
    if: (github.event_name == 'release' && github.event.release.prerelease == false) || github.event_name == 'workflow_dispatch'
    steps:
      - name: Resolve release tag
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            tag="$(jq -r .release.tag_name "$GITHUB_EVENT_PATH")"
          else
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ -z "${tag}" || "${tag}" == "null" ]]; then
            echo "could not resolve a published release tag" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs

      - name: Generate version config override
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          ruby scripts/generate-docs-version-override.rb --tag "$RELEASE_TAG"

      - name: Jekyll build
        working-directory: docs
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build \
            --config _config.yml,_config_versions.yml \
            --source . \
            --destination ./_site \
            --baseurl ""

      - name: Verify custom-domain root paths
        working-directory: docs
        run: |
          if grep -R -nE --include='*.html' '(href|src)="/(AppTheory|apptheory)/' ./_site; then
            echo "Found root-relative links with the repository path; custom-domain assets must resolve from /." >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    # Same guard as the build job: never deploy from prereleases or
    # non-release events (e.g. branch pushes).
    if: (github.event_name == 'release' && github.event.release.prerelease == false) || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: https://apptheory.theorycloud.ai/
    steps:
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
